<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>贪吃蛇进阶版</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#14161c;color:#e8e8e8;font-family:-apple-system,"PingFang SC",sans-serif}
  h1{margin:0 0 8px;font-size:22px}
  #hud{display:flex;gap:24px;margin-bottom:10px;font-size:15px}
  canvas{background:#1d2029;border-radius:8px;box-shadow:0 8px 30px #0008}
  p{color:#8a8f9c;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<h1>🐍 贪吃蛇进阶版</h1>
<div id="hud"><span>得分:<b id="score">0</b></span><span>最高分:<b id="best">0</b></span><span id="buff"></span></div>
<canvas id="c" width="480" height="480"></canvas>
<p>方向键 / WASD 移动 · 空格 开始/暂停 · 🍎 加分 · ⚡ 加速 · 🧱 障碍</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const N=24,S=cv.width/N;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),buffEl=document.getElementById('buff');
let best=0;try{best=+localStorage.getItem('snakeBest')||0}catch(e){}
bestEl.textContent=best;

let snake,dir,nextDir,food,bolt,walls,score,baseDelay,boostUntil,state,last;

function reset(){
  snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];
  dir=nextDir={x:1,y:0};
  walls=[];score=0;baseDelay=130;boostUntil=0;bolt=null;
  food=spawn();state='ready';
  scoreEl.textContent=0;buffEl.textContent='';
}
function free(p){
  return !snake.some(s=>s.x===p.x&&s.y===p.y)&&!walls.some(w=>w.x===p.x&&w.y===p.y)
    &&!(food&&food.x===p.x&&food.y===p.y)&&!(bolt&&bolt.x===p.x&&bolt.y===p.y);
}
function spawn(){
  let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(!free(p));
  return p;
}
function step(){
  dir=nextDir;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)||walls.some(w=>w.x===h.x&&w.y===h.y))return gameOver();
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score++;scoreEl.textContent=score;food=spawn();
    baseDelay=Math.max(65,baseDelay-2);
    if(score%3===0)walls.push(spawn());
    if(!bolt&&Math.random()<0.35)bolt=spawn();
  }else if(bolt&&h.x===bolt.x&&h.y===bolt.y){
    boostUntil=performance.now()+4000;bolt=null;score+=2;scoreEl.textContent=score;
  }else snake.pop();
}
function gameOver(){
  state='over';
  if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('snakeBest',best)}catch(e){}}
}
function cell(p,color,r=3){
  ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(p.x*S+1,p.y*S+1,S-2,S-2,r);ctx.fill();
}
function emoji(p,ch){ctx.font=(S-4)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,p.x*S+S/2,p.y*S+S/2+1)}
function draw(now){
  ctx.clearRect(0,0,cv.width,cv.height);
  walls.forEach(w=>emoji(w,'🧱'));
  emoji(food,'🍎');if(bolt)emoji(bolt,'⚡');
  const boosted=now<boostUntil;
  snake.forEach((s,i)=>cell(s,i===0?'#7CFFB2':boosted?'#ffd54a':'#3ddc84',i===0?6:3));
  buffEl.textContent=boosted?'⚡ 加速中':'';
  if(state!=='run'){
    ctx.fillStyle='#000a';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
    const t={ready:'按空格开始',paused:'已暂停',over:'游戏结束 · 空格重来'}[state];
    ctx.fillText(t,cv.width/2,cv.height/2);
  }
}
function loop(now){
  if(state==='run'){
    const d=now<boostUntil?baseDelay*0.55:baseDelay;
    if(now-last>=d){last=now;step()}
  }
  draw(now);requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m){e.preventDefault();if(m[0]!==-dir.x||m[1]!==-dir.y)nextDir={x:m[0],y:m[1]};if(state==='ready'){state='run';last=performance.now()}}
  else if(k===' '){
    e.preventDefault();
    if(state==='over'){reset();state='run'}
    else if(state==='run')state='paused';
    else state='run';
    last=performance.now();
  }
});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
